name: Build and publish WipeFiles APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.6.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wipefiles-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="$REF_NAME"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          mkdir -p release

          cp "$APK" "release/WipeFiles-${RELEASE_TAG}.apk"

          cd release
          sha256sum "WipeFiles-${RELEASE_TAG}.apk" > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: WipeFiles ${{ steps.release.outputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/WipeFiles-${{ steps.release.outputs.tag_name }}.apk
            release/SHA256SUMS.txt
